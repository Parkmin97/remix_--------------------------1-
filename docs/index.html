:root{--fg:#1a1a1a;--muted:#666;--line:#e3e3e3;--bg:#fff;--accent:#c97a00;--soft:#faf9f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",
 "Noto Sans KR",sans-serif;line-height:1.75;font-size:16px;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:1.7rem;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}

h3{font-size:1rem;margin:24px 0 8px;color:#333}
p{margin:12px 0}
ul,ol{margin:12px 0;padding-left:22px}
li{margin:6px 0}
a{color:var(--accent);text-underline-offset:3px}
strong{font-weight:700}
code{background:var(--soft);border:1px solid var(--line);border-radius:5px;
 padding:1px 5px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.tw{overflow-x:auto;margin:16px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.93rem}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:700}
blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);
 background:var(--soft);color:#444}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 28px}
.back{display:inline-block;margin-bottom:24px;font-size:.9rem;color:var(--muted);
 text-decoration:none}
.back:hover{color:var(--accent)}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:18px 20px;
 margin:12px 0;text-decoration:none;color:inherit;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:1.05rem;margin-bottom:4px}
.card span{color:var(--muted);font-size:.9rem}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
 color:var(--muted);font-size:.85rem}
@media (max-width:520px){.wrap{padding:24px 16px 60px}h1{font-size:1.4rem}}
